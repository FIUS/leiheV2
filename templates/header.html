{{ define "header" }}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIUS Verleih</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'fius-bg': '#0B0F19',
                        'fius-card': '#111827',
                        'fius-border': '#1F2937',
                        'fius-blue': '#3B82F6',
                        'fius-muted': '#9CA3AF',
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-fius-bg text-gray-100 min-h-screen">

<nav class="border-b  p-4">
    <div class="container mx-auto flex justify-between items-center">
        <!-- Link zurück zur Startseite -->
        <a href="/" class="flex items-center gap-2 text-2xl font-bold text-white">
            <img src="/static/images/fius-logo-white.svg" alt="FIUS Logo" class="h-12 w-auto">
            <span class="text-fius-blue">Verleih</span>
        </a>

        <div class="flex items-center gap-4 relative" x-data="{ open: false }" @click.outside="open = false">

            {{ if .UserRole }}
            <!-- EINGELOGGT -->
            <button @click="open = !open" class="flex items-center gap-2 px-3 py-2  border  rounded-lg hover:border-blue-500 transition cursor-pointer">
                <div class="w-7 h-7 rounded-full bg-blue-500/20 text-blue-500 flex items-center justify-center font-bold text-xs uppercase">
                    {{ slice .UserRole 0 1 }}
                </div>
                <span class="text-sm text-gray-200 font-medium capitalize">{{ .UserRole }}</span>
                <svg class="w-4 h-4 text-fius-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <!-- Dropdown Menü -->
            <div x-show="open" class="absolute top-12 right-0 w-48  border  rounded-xl shadow-lg py-2 z-50 bg-fius-bg" style="display: none;">

                {{ if or (eq .UserRole "admin") (eq .UserRole "maintainer") }}
                <a href="/admin" class="block px-4 py-2 text-sm text-gray-200 hover:bg-fius-bg hover:text-blue-500 transition">Admin Panel</a>
                <div class="border-t  my-1"></div>
                {{ end }}

                <a href="/logout" class="block px-4 py-2 text-sm text-red-400 hover:bg-fius-bg hover:text-red-300 transition">Logout</a>
            </div>
            {{ else }}
            <!-- AUSGELOGGT -->
            <div class="flex items-center gap-2">
                <span class="text-xs text-fius-muted mr-2">Test-Logins:</span>
                <a href="/dev-login?role=user" class="px-3 py-1.5 text-xs font-semibold  border  text-gray-200 rounded-lg hover:border-blue-500 transition">User</a>
                <a href="/dev-login?role=maintainer" class="px-3 py-1.5 text-xs font-semibold  border  text-gray-200 rounded-lg hover:border-blue-500 transition">FSler</a>
                <a href="/dev-login?role=admin" class="px-3 py-1.5 text-xs font-semibold bg-blue-500/10 border border-blue-500/30 text-blue-500 rounded-lg hover:bg-blue-500 hover:text-white transition">Admin</a>
            </div>
            {{ end }}

        </div>
    </div>
</nav>

<main class="container mx-auto p-4 mt-4">
    {{ end }}
