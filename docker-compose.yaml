services:
  db:
    image: postgres:16-alpine
    container_name: fius-verleih-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fius
      POSTGRES_PASSWORD: pleasechangeme
      POSTGRES_DB: verleih
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql

volumes:
  postgres_data: