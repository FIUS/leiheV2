{{ template "header" . }}

<div class="max-w-xl mx-auto bg-theme-card p-8 rounded-xl shadow-lg border border-theme-border mt-12">
    <h2 class="text-2xl font-bold mb-6 text-white text-center">Bilder-Zuordnung</h2>

    <form method="POST" action="/setup-bilder" class="space-y-6">
        <input type="hidden" name="image_name" value="{{ .CurrentImage }}">
        <!-- NEU: Gibt die bisherigen Skips beim POST mit -->
        <input type="hidden" name="skips" value="{{ .CurrentSkips }}">

        <div class="mb-6">
            <label class="block font-bold text-theme-muted uppercase text-xs mb-3 text-center">Aktuelles Bild</label>
            <div class="border-2 border-theme-border rounded-lg p-4 bg-theme-bg flex justify-center items-center h-80">
                <img src="/static/custom_images/{{ .CurrentImage }}"
                     alt="Spiel-Cover"
                     class="max-h-full object-contain rounded drop-shadow-lg"
                     onerror="this.onerror=null; this.src='/static/images/image-placeholder.svg';">
            </div>
        </div>

        <div>
            <label class="block font-bold text-theme-muted uppercase text-xs mb-2">Welches Spiel ist das?</label>
            <select name="item_id" class="w-full border border-theme-border bg-[#1E2532] text-white p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" required autofocus>
                <option value="">-- Bitte Spiel auswählen --</option>
                {{ range .Games }}
                <option value="{{ .ID }}">{{ .Name }}</option>
                {{ end }}
            </select>
        </div>

        <div class="flex gap-4 pt-6 border-t border-theme-border mt-6">
            <!-- NEU: Baut die Liste dynamisch auf (z.B. ?skip=BildA,BildB) -->
            <a href="/setup-bilder?skip={{ if .CurrentSkips }}{{ .CurrentSkips }},{{ end }}{{ .CurrentImage }}"
               class="w-1/3 text-center bg-theme-bg hover:bg-[#1E2532] text-gray-400 font-bold py-4 px-4 rounded-xl border border-theme-border transition cursor-pointer">
                Überspringen
            </a>
            <button type="submit" class="w-2/3 bg-blue-600 text-white font-bold py-4 px-4 rounded-xl hover:bg-blue-500 shadow-lg transition text-lg cursor-pointer">
                Speichern & Nächstes
            </button>
        </div>
    </form>
</div>

{{ template "footer" . }}
