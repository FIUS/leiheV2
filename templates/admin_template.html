{{ define "admin_layout" }}
{{ template "header" . }}

<div class="flex min-h-[85vh] bg-fius-bg text-gray-100 border border-fius-border rounded-xl shadow-lg mt-4 overflow-hidden">
    <!-- Linke Sidebar -->
    <aside class="w-64 bg-fius-card border-r border-fius-border flex flex-col shrink-0">
        <div class="p-6 border-b border-fius-border">
            <h2 class="text-xs font-bold text-white tracking-widest uppercase">Administration</h2>
        </div>
        <nav class="flex-1 p-4 space-y-1.5 text-sm">
            <a href="/admin/dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg border transition font-semibold {{ if eq .ActiveTab "dashboard" }}bg-[#1E2532] text-blue-500 border-blue-500{{ else }}text-fius-muted hover:bg-[#1E2532] hover:text-white border-transparent{{ end }}">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            Dashboard
            </a>
            <a href="/admin/games" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg border transition font-semibold {{ if eq .ActiveTab "games" }}bg-[#1E2532] text-blue-500 border-blue-500{{ else }}text-fius-muted hover:bg-[#1E2532] hover:text-white border-transparent{{ end }}">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Spieleverwaltung
            </a>
            <a href="/admin/bookings" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg border transition font-semibold {{ if eq .ActiveTab "bookings" }}bg-[#1E2532] text-blue-500 border-blue-500{{ else }}text-fius-muted hover:bg-[#1E2532] hover:text-white border-transparent{{ end }}">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            Buchungen
            </a>
            {{ if eq .UserRole "admin" }}
            <a href="/admin/users" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg border transition font-semibold {{ if eq .ActiveTab "users" }}bg-[#1E2532] text-blue-500 border-blue-500{{ else }}text-fius-muted hover:bg-[#1E2532] hover:text-white border-transparent{{ end }}">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            Nutzer & OIDC
            </a>
            <a href="/admin/settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg border transition font-semibold {{ if eq .ActiveTab "settings" }}bg-[#1E2532] text-blue-500 border-blue-500{{ else }}text-fius-muted hover:bg-[#1E2532] hover:text-white border-transparent{{ end }}">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Einstellungen
            </a>
            {{ end }}
        </nav>
    </aside>

    <!-- Content Panel -->
    <main class="flex-1 p-8 bg-[#0B101A] overflow-y-auto">
        {{ template "admin_content" . }}
    </main>
</div>

<style> [x-cloak] { display: none !important; } </style>
{{ template "footer" . }}
{{ end }}
