services:
  db:
    image: postgres:16-alpine
    container_name: leih-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - "${DB_PORT:?DB_PORT must be set in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/migrations/001_auth.sql:/docker-entrypoint-initdb.d/2_auth.sql
      - ./db/migrations/002_item_expansion.sql:/docker-entrypoint-initdb.d/3_item_expansion.sql
      - ./db/migrations/003_booking_confirmation.sql:/docker-entrypoint-initdb.d/4_booking_confirmation.sql
      - ./db/migrations/004_booking_creator.sql:/docker-entrypoint-initdb.d/5_booking_creator.sql
      - ./db/migrations/005_item_bgg_rating.sql:/docker-entrypoint-initdb.d/6_item_bgg_rating.sql
      - ./db/migrations/006_booking_deposit.sql:/docker-entrypoint-initdb.d/7_booking_deposit.sql
      - ./db/migrations/007_app_settings.sql:/docker-entrypoint-initdb.d/8_app_settings.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leih -d verleih"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:?APP_PORT must be set in .env}:8080"
    env_file:
      - path: .env
        required: true
    environment:
      GIN_MODE: release
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES:-}
    volumes:
      - ./static/custom_images:/app/static/custom_images
      - thumbnail_cache:/app/image_cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  thumbnail_cache: