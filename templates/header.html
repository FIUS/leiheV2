{{ define "header" }}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIUS Verleih</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="stylesheet" href="/static/css/tailwind.css">
    <script defer src="/static/js/alpine.min.js"></script>
</head>
<body class="bg-fius-bg text-gray-100 min-h-screen">

<nav class="border-b border-fius-border p-4">
    <div class="container mx-auto flex justify-between items-center">
        <!-- Link zurück zur Startseite -->
        <a href="/" class="flex items-center gap-2 text-2xl font-bold text-white">
            <img src="/static/images/fius-logo-white.svg" alt="FIUS Logo" class="h-12 w-auto">
            <span class="text-fius-blue">Verleih</span>
        </a>

        <div class="flex items-center gap-4 relative" x-data="{ open: false }" @click.outside="open = false">

            {{ if and .UserRole (ne .UserRole "guest") }}
            <!-- EINGELOGGT -->
            <button @click="open = !open" class="flex items-center gap-2 px-3 py-2 border border-fius-border rounded-lg hover:border-blue-500 transition cursor-pointer">
                <div class="w-7 h-7 rounded-full bg-blue-500/20 text-blue-500 flex items-center justify-center font-bold text-xs uppercase">
                    {{ if .UserName }}{{ slice .UserName 0 1 }}{{ else }}?{{ end }}
                </div>
                <span class="text-sm text-gray-200 font-medium">{{ if .UserName }}{{ .UserName }}{{ else }}Konto{{ end }}</span>
                <svg class="w-4 h-4 text-fius-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <!-- Dropdown Menü -->
            <div x-show="open" class="absolute top-12 right-0 w-56 border border-fius-border rounded-xl shadow-lg py-2 z-50 bg-fius-bg" style="display: none;">
                <a href="/settings" class="block px-4 py-2 text-sm text-gray-200 hover:bg-fius-bg hover:text-blue-500 transition">Benutzereinstellungen</a>
                <a href="/bookings" class="block px-4 py-2 text-sm text-gray-200 hover:bg-fius-bg hover:text-blue-500 transition">Ausleihen</a>
                {{ if or (eq .UserRole "admin") (eq .UserRole "maintainer") }}
                <a href="/admin" class="block px-4 py-2 text-sm text-gray-200 hover:bg-fius-bg hover:text-blue-500 transition">Admin Panel</a>
                <div class="border-t border-fius-border my-1"></div>
                {{ end }}

                <a href="/logout" class="block px-4 py-2 text-sm text-red-400 hover:bg-fius-bg hover:text-red-300 transition">Logout</a>
            </div>
            {{ else }}
            <!-- AUSGELOGGT / GAST -->
            <div class="flex items-center gap-2">
                <a href="/login" class="px-3 py-1.5 text-xs font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition">Anmelden</a>
            </div>
            {{ end }}

        </div>
    </div>
</nav>

<main class="container mx-auto p-4 mt-4">
    {{ end }}
