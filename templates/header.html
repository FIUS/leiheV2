{{ define "header" }}

    <title>FIUS Verleih</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'fius-bg': '#0B0F19',
                        'fius-card': '#111827',
                        'fius-border': '#1F2937',
                        'fius-blue': '#3B82F6',
                        'fius-muted': '#9CA3AF',

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<body class="bg-fius-bg text-gray-100 min-h-screen">
