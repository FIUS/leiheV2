services:
  db:
    image: postgres:16-alpine
    container_name: fius-verleih-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - "${DB_PORT:?DB_PORT must be set in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/migrations/001_auth.sql:/docker-entrypoint-initdb.d/2_auth.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fius -d verleih"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:?APP_PORT must be set in .env}:8080"
    env_file:
      - path: .env
        required: true
    volumes:
      - ./static/custom_images:/app/static/custom_images
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: